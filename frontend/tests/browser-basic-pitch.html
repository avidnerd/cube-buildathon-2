<!doctype html><html lang="en"><meta charset="utf-8"><title>Basic Pitch integration check</title><body><h1>Basic Pitch browser check</h1><button id="run">Run synthetic recording check</button><p id="result">Ready. Uses generated audio, not your microphone.</p><script type="module">
const result=document.querySelector('#result');
document.querySelector('#run').onclick=async()=>{
 let worker,context;
 try {
  result.textContent='Generating an A4 recording…';
  context=new AudioContext();await context.resume();
  const oscillator=context.createOscillator();oscillator.frequency.value=440;
  const gain=context.createGain();gain.gain.value=.25;
  const destination=context.createMediaStreamDestination();oscillator.connect(gain);gain.connect(destination);
  const recorder=new MediaRecorder(destination.stream);const chunks=[];
  recorder.ondataavailable=e=>chunks.push(e.data);
  const done=new Promise(resolve=>recorder.onstop=resolve);
  recorder.start();oscillator.start();
  await new Promise(resolve=>setTimeout(resolve,2000));
  recorder.stop();oscillator.stop();await done;
  const decoded=await context.decodeAudioData(await new Blob(chunks,{type:recorder.mimeType}).arrayBuffer());
  const offline=new OfflineAudioContext(1,Math.ceil(decoded.duration*22050),22050);
  const source=offline.createBufferSource();source.buffer=decoded;source.connect(offline.destination);source.start();
  const rendered=await offline.startRendering();const samples=rendered.getChannelData(0);
  await context.close();destination.stream.getTracks().forEach(t=>t.stop());
  worker=new Worker(new URL('../src/basicPitch.worker.js',import.meta.url),{type:'module'});
  worker.onmessage=({data})=>{
   if(data.type==='progress')result.textContent=`Transcribing: ${Math.round(data.progress*100)}%`;
   if(data.type==='error'){result.textContent='FAIL: '+data.message;worker.terminate();}
   if(data.type==='complete'){result.textContent=(data.notes.some(n=>n.midi===69)?'PASS':'FAIL')+': '+JSON.stringify(data.notes);worker.terminate();}
  };
  worker.onerror=e=>{result.textContent='FAIL: '+e.message;worker.terminate();};
  worker.postMessage({samples,modelUrl:new URL('/models/basic-pitch/model.json',location.origin).href},[samples.buffer]);
 }catch(e){result.textContent='FAIL: '+e.message;worker?.terminate();context?.close();}
};
</script></body></html>
